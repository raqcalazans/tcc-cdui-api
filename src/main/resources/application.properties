spring.application.name=amantes-do-futebol

# SpringDoc OpenAPI (Swagger) Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.packages-to-scan=com.cdui.amantesdofutebol
springdoc.show-actuator=true
springdoc.writer-with-order-by-keys=true

# Personalização da informação da API
springdoc.info.title=Amantes do Futebol
springdoc.info.description=API para cadastrar fãs de futebol e registrar suas preferências e hábitos esportivos.
springdoc.info.version=1.0.0
springdoc.info.contact.name=Raquel Calazans
springdoc.info.contact.email=raqcalazans@gmail.com

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/amantes_do_futebol}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA and Hibernate configuration
spring.jpa.defer-datasource-initialization=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Mostra o SQL gerado pelo Hibernate no console (ótimo para debugging)
spring.jpa.show-sql=true

# Server port
server.port=8080



